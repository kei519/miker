[target.'cfg(target_arch = "x86_64")']
rustflags = [
    "-C",
    "no-redzone=yes",
    "-C",
    "relocation-model=static",
    "-C",
    "link-arg=-Tkernel/link.ld",
    "-C",
    "code-model=kernel",
]

[target.'cfg(target_arch = "aarch64")']
rustflags = [
    "-C",
    "no-redzone=yes",
    "-C",
    "relocation-model=static",
    "-C",
    "link-arg=-Tkernel/link.ld",
    "-C",
    "code-model=tiny",
]
