# [build]
# dir = "build"

[arch.x86_64.target]
kernel = "x86_64-unknown-none"
uefi = "x86_64-unknown-uefi"

# [arch.x86_64.image]
# image_name = "disk.img"
# ovmf_vars = "vars.fd"

[[arch.x86_64.image.partition]]
name = "MIKER-EFI"
type = "efi"
size = 0x80_000
# We have to use the value below to format EFI partition with FAT32.
# size = 0x408_0000

[[arch.x86_64.image.component]]
name = "bootloader"
partition = "MIKER-EFI"
install = "EFI/BOOT/BOOTX64.EFI"

[[arch.x86_64.image.component]]
name = "kernel"
partition = "MIKER-EFI"
install = "boot/kernel"

[arch.aarch64.target]
kernel = "aarch64-unknown-none"
uefi = "aarch64-unknown-uefi"

[[arch.aarch64.image.partition]]
name = "MIKER-EFI"
type = "efi"
size = 0x80_000

[[arch.aarch64.image.component]]
name = "bootloader"
partition = "MIKER-EFI"
install = "EFI/BOOT/BOOTAA64.EFI"

[[arch.aarch64.image.component]]
name = "kernel"
partition = "MIKER-EFI"
install = "boot/kernel"
